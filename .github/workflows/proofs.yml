name: Proofs

on:
  workflow_dispatch:
    inputs:
      proof:
        description: Focused proof to run; gate plant proofs must use the full Tests dispatch
        type: choice
        required: true
        default: tests
        options: [tests, mutation, semgrep, worker-image, swarm-image, brain-smoke, helm-kind, github-access, row-memory, operations-cpu]
      base:
        description: Base revision for mutation or Semgrep scope
        required: true
        default: origin/dev
      tests:
        description: Space separated test paths or node ids under tests for the tests proof
        required: false
        default: ''
      browser:
        description: Install Chromium for focused browser tests
        type: boolean
        required: false
        default: false

concurrency:
  group: ${{ inputs.proof == 'tests' && format('focused-proof-{0}', github.run_id) || format('hosted-lane-{0}', ((endsWith(github.run_id, '0') || endsWith(github.run_id, '1') || endsWith(github.run_id, '2')) && 'a') || ((endsWith(github.run_id, '3') || endsWith(github.run_id, '4') || endsWith(github.run_id, '5')) && 'b') || 'c') }}
  queue: max
  cancel-in-progress: false

permissions:
  contents: read
  pull-requests: read
  actions: read

jobs:
  operations-cpu:
    if: inputs.proof == 'operations-cpu'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          path: head
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.base }}
          path: base
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          version: '0.12.23'
          enable-cache: false
      - name: Install dependencies shared by both revisions
        working-directory: head
        run: uv pip install --system --excludes .github/test-excludes.txt -e '.[dev,all]'
      - name: Replay base on the shared runner
        working-directory: base
        env:
          OPERATIONS_CPU_REPORT: ${{ github.workspace }}/operations-base.json
          OPERATIONS_CPU_BASELINE: 'true'
          PYTHONUNBUFFERED: '1'
        run: |
          cp ../head/tests/swarm_ledger/test_operations_cpu.py tests/swarm_ledger/test_operations_cpu.py
          cp ../head/tests/swarm_ledger/operations_corpus.json.gz tests/swarm_ledger/operations_corpus.json.gz
          python -m pytest tests/swarm_ledger/test_operations_cpu.py -n 0 --tb=short
      - name: Replay head on the same runner
        working-directory: head
        env:
          OPERATIONS_CPU_REPORT: ${{ github.workspace }}/operations-head.json
          PYTHONUNBUFFERED: '1'
        run: |
          python -m pytest tests/swarm_ledger/test_operations_cpu.py -n 0 --tb=short
      - name: Retain the CPU profile and every outcome
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: operations-cpu
          path: operations-*.json
          if-no-files-found: error

  operations-compare:
    if: always() && inputs.proof == 'operations-cpu'
    needs: operations-cpu
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: operations-*
          merge-multiple: true
      - name: Compare acceptance, revision and persistence on the same corpus
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          base = json.loads(Path('operations-base.json').read_text())
          head = json.loads(Path('operations-head.json').read_text())
          assert base['source'] == head['source']
          assert base['outputs'] == head['outputs'], 'Operation or persisted-state outcomes changed'
          print(json.dumps({
              'requests': head['requests'],
              'base_cpu_seconds_per_request': base['mean_cpu_seconds'],
              'head_cpu_seconds_per_request': head['mean_cpu_seconds'],
              'ratio': head['mean_cpu_seconds'] / base['mean_cpu_seconds'],
              'operation_mix': head['source']['operation_mix'],
          }, indent=2))
          assert head['mean_cpu_seconds'] <= 0.268092752
          assert head['mean_cpu_seconds'] <= base['mean_cpu_seconds'] / 2
          PY

  row-memory:
    if: inputs.proof == 'row-memory'
    uses: ./.github/workflows/ledger-row-memory.yml
    with:
      base: ${{ inputs.base }}

  github-access:
    if: inputs.proof == 'github-access'
    uses: ./.github/workflows/github-access-audit.yml
    secrets:
      TCC_CI_CLIENT_ID: ${{ secrets.TCC_CI_CLIENT_ID }}
      TCC_CI_APP_PRIVATE_KEY: ${{ secrets.TCC_CI_APP_PRIVATE_KEY }}

  mutation:
    if: inputs.proof == 'mutation'
    uses: ./.github/workflows/mutation-preflight.yml
    with:
      base: ${{ inputs.base }}

  semgrep:
    if: inputs.proof == 'semgrep'
    uses: ./.github/workflows/semgrep.yml
    with:
      base: ${{ inputs.base }}

  worker-image:
    if: inputs.proof == 'worker-image'
    uses: ./.github/workflows/swarm-node-smoke.yml

  swarm-image:
    if: inputs.proof == 'swarm-image'
    uses: ./.github/workflows/swarm-smoke.yml

  brain-smoke:
    if: inputs.proof == 'brain-smoke'
    uses: ./.github/workflows/brain-smoke.yml

  helm-kind:
    if: inputs.proof == 'helm-kind'
    uses: ./.github/workflows/helm-kind.yml

  tests:
    if: inputs.proof == 'tests'
    runs-on: ${{ (github.event_name != 'pull_request_target' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && contains(fromJSON('["nestorcolt","agenticore-app[bot]","tcc-main-ci[bot]"]'), github.actor) && contains(fromJSON('["nestorcolt","agenticore-app[bot]","tcc-main-ci[bot]"]'), github.triggering_actor) || (github.event_name == 'merge_group' || github.event_name == 'push' && github.ref == 'refs/heads/dev') && github.actor == 'github-merge-queue[bot]' && github.triggering_actor == 'github-merge-queue[bot]') && 'anton-oss' || 'ubuntu-latest' }}
    timeout-minutes: 15
    env:
      TEST_PATHS: ${{ inputs.tests }}
      PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/.playwright
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Require explicit test paths
        run: |
          [[ "$TEST_PATHS" != *$'\n'* ]] || { echo '::error::Give every test path on one line.'; exit 1; }
          read -r -a paths <<< "$TEST_PATHS"
          [[ ${#paths[@]} -gt 0 ]] || { echo '::error::Choose explicit test paths under tests/.'; exit 1; }
          for path in "${paths[@]}"; do
            [[ "$path" == tests/* && "$path" != *..* ]] || { echo '::error::Every test path must be under tests/.'; exit 1; }
          done

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - uses: astral-sh/setup-uv@v10.2.0
        with:
          version: '0.12.23'
          checksum: '9167d72b3319674b6303c4cbe071854bba13ebdf3d76b1a7cbdc175471fb66d6'
          enable-cache: false

      - name: Install dependencies
        run: uv pip install --system --excludes .github/test-excludes.txt -e '.[dev,all]'

      - name: Install the browser that page tests drive
        if: inputs.browser
        timeout-minutes: 6
        uses: ./.github/actions/browser-cache

      - name: Run selected tests
        env:
          PYTHONUNBUFFERED: '1'
        run: |
          read -r -a paths <<< "$TEST_PATHS"
          python -m pytest "${paths[@]}" -v -n auto --dist loadgroup --tb=short
