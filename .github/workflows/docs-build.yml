name: Build documentation

on:
  pull_request:
    branches: [dev]
    paths:
      - "docs/**"
      - "index.md"
      - "_config.yml"
      - "assets/**"
      - ".github/workflows/pages.yml"
      - ".github/workflows/docs-build.yml"
  push:
    branches: [dev, "diffcheck/**"]
    paths:
      - "docs/**"
      - "index.md"
      - "_config.yml"
      - "assets/**"
      - ".github/workflows/pages.yml"
      - ".github/workflows/docs-build.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ format('hosted-lane-{0}', ((endsWith(github.run_id, '0') || endsWith(github.run_id, '1') || endsWith(github.run_id, '2')) && 'a') || ((endsWith(github.run_id, '3') || endsWith(github.run_id, '4') || endsWith(github.run_id, '5')) && 'b') || 'c') }}
  queue: max
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Build with Jekyll
        uses: actions/jekyll-build-pages@v1
        with:
          source: ./
          destination: ./_site
