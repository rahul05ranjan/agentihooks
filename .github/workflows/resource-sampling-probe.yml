name: Resource sampling GC probe

on:
  workflow_dispatch:
  push:
    branches: [engineer-d44a5a-0258]

permissions:
  contents: read

jobs:
  controls:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.11', '3.12']
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          version: '0.12.23'
          enable-cache: false
      - run: uv pip install --system --excludes .github/test-excludes.txt -e '.[dev,all]'
      - name: Test warning ownership and retry with unchanged sampler
        run: python -m pytest tests/test_resource_sampling_gc_probe.py -v -s -n 0 --tb=long
  replay:
    needs: controls
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          version: '0.12.23'
          enable-cache: false
      - run: uv pip install --system --excludes .github/test-excludes.txt -e '.[dev,all]'
      - name: Replay the earlier tests from the failed worker
        run: |
          python - <<'PY'
          import json, subprocess, sys
          from pathlib import Path
          nodes = json.loads(Path('tests/resource_sampling_replay.json').read_text())
          nodes.append('tests/test_swarm_v2_resource_sampling.py::test_measure_reports_the_whole_tree_of_a_live_workload')
          for iteration in range(5):
              result = subprocess.run([sys.executable, '-m', 'pytest', *nodes, '-v', '-n', '0', '--tb=long'])
              print(f'NATURAL-REPLAY {iteration}: exit {result.returncode}', flush=True)
          PY
