name: Protected runner actors

on:
  workflow_call:
    outputs:
      actors:
        value: ${{ jobs.actors.outputs.actors }}

permissions:
  contents: read

jobs:
  actors:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    outputs:
      actors: ${{ steps.actors.outputs.actors }}
    steps:
      - uses: actions/checkout@v4
        with:
          repository: the-cloud-clockwork/agentihooks
          ref: dev
          persist-credentials: false
      - name: Read protected actor approvals
        id: actors
        run: >-
          python3 -I -c 'import json; from pathlib import Path; print("actors=" + json.dumps(json.loads(Path(".github/workflows/trusted-actors.json").read_text()), separators=(",", ":")))' >> "$GITHUB_OUTPUT"
