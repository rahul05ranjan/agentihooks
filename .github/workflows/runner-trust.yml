name: Protected runner actors

on:
  workflow_call:
    outputs:
      actors:
        value: ${{ jobs.actors.outputs.actors }}

permissions:
  contents: read

jobs:
  actors:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    outputs:
      actors: ${{ steps.actors.outputs.actors }}
    steps:
      - uses: actions/checkout@v4
        with:
          repository: the-cloud-clockwork/agentihooks
          ref: dev
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install workflow parser
        run: python -m pip install 'pyyaml>=6.0'
      - name: Read protected actor approvals
        id: actors
        run: python -m scripts.ci_runner_trust --actors-output >> "$GITHUB_OUTPUT"
