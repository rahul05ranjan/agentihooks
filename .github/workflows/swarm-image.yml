name: Swarm image

on:
  push:
    branches: [dev]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: swarm-image-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  tags:
    if: github.event_name == 'push' && github.ref == 'refs/heads/dev'
    runs-on: ubuntu-latest
    outputs:
      tags: ${{ steps.tags.outputs.tags }}
    steps:
      - id: tags
        env:
          IMAGE: ghcr.io/the-cloud-clockwork/agentihooks-swarm
        run: |
          {
            echo 'tags<<EOF'
            echo "$IMAGE:dev"
            echo "$IMAGE:dev-${GITHUB_SHA:0:7}"
            echo EOF
          } >> "$GITHUB_OUTPUT"
  runner-trust:
    uses: the-cloud-clockwork/agentihooks/.github/workflows/runner-trust.yml@dev
  publish:
    needs: [tags, runner-trust]
    if: >-
      github.event_name != 'pull_request_target' &&
      (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) &&
      contains(fromJSON(needs.runner-trust.outputs.actors), github.triggering_actor) &&
      github.event_name == 'push' && github.ref == 'refs/heads/dev'
    permissions:
      contents: read
      packages: write
    uses: The-Cloud-Clockwork/.github/.github/workflows/ghcr-build-reusable.yml@main
    with:
      image_name: ghcr.io/the-cloud-clockwork/agentihooks-swarm
      tags: ${{ needs.tags.outputs.tags }}
      cache_scope: swarm
